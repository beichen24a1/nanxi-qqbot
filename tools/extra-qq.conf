; SnowLuma second QQ instance (test account <TEST_BOT_QQ>) - supervisor program.
;
; WHY THIS FILE EXISTS
;   The container starts a second QQ client only when SNOWLUMA_EXTRA_QQ_HOMES is set
;   at container creation. It is not set on the current container, so the second
;   instance is started from this file instead. /etc/supervisor/conf.d/ is NOT on a
;   volume, so this file disappears on container restart -- copy it back:
;
;     docker cp tools\extra-qq.conf snowluma:/etc/supervisor/conf.d/extra-qq.conf
;     docker exec snowluma sh -c "supervisorctl reread; supervisorctl update"
;
;   or run 启动\恢复测试bot.ps1 which does exactly that.
;
; DO NOT hardcode DBUS_SESSION_BUS_ADDRESS here.
;   %(ENV_xxx)s is supervisor's runtime interpolation: it reads supervisord's OWN
;   environment, which start.sh exports fresh on every container boot (the dbus
;   socket path contains a random suffix and changes per boot). Hardcoding it works
;   only until the next container restart.
;
; The login state lives in the volume qq-client-data -> /app/.local/share/qq2,
; so restarting this program never requires a new QR scan.

[program:qq-extra-1]
command=/bin/sh -c 'exec qq --no-sandbox --disable-gpu --disable-software-rasterizer --disable-gpu-compositing'
directory=/app
user=snowluma
priority=15
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/app/.local/share/qq2",DISPLAY="%(ENV_DISPLAY)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",DBUS_SESSION_BUS_ADDRESS="%(ENV_DBUS_SESSION_BUS_ADDRESS)s",SNOWLUMA_HOOK_RUNTIME_DIR="%(ENV_SNOWLUMA_HOOK_RUNTIME_DIR)s"
